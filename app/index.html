<body>
<title>Sundaram Accounting</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: ledger workspace — fixed side rail of books on desktop, top tab strip on phones; content is dense tables with summary first. */
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --surface-2:#EEF1EC; --line:#DDE2DC;
  --fg:#15211D; --muted:#56645F; --faint:#7D8984;
  --brand:#0F6B63; --brand-fg:#FFFFFF; --brand-soft:#DDF0EC; --brand-ink:#0A4C46;
  --amber:#E0A21B; --amber-soft:#FBF0D2; --amber-ink:#7A5300;
  --good:#16794C; --good-soft:#DFF2E7; --bad:#B42318; --bad-soft:#FDE8E6; --info-soft:#E6EEF8; --info-ink:#1F4E8C;
  --rail:#0E2523; --rail-fg:#C2D3D0; --rail-active:#1B3a37;
  --shadow:0 18px 40px -22px rgba(19,32,28,.35);
  --f-ui:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#161F1C; --surface-2:#1D2925; --line:#2A3833;
  --fg:#E8EEEB; --muted:#A3B1AB; --faint:#7F8D87;
  --brand:#3DB5A6; --brand-fg:#04120F; --brand-soft:#123430; --brand-ink:#9FE0D6;
  --amber:#EBB646; --amber-soft:#3A2D10; --amber-ink:#F3D08A;
  --good:#5CCB92; --good-soft:#183528; --bad:#F2877C; --bad-soft:#3D1D1A; --info-soft:#1A2A40; --info-ink:#9CC0EE;
  --rail:#071413; --rail-fg:#B0C4C0; --rail-active:#173230;
  --shadow:0 18px 40px -22px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#161F1C; --surface-2:#1D2925; --line:#2A3833;
  --fg:#E8EEEB; --muted:#A3B1AB; --faint:#7F8D87;
  --brand:#3DB5A6; --brand-fg:#04120F; --brand-soft:#123430; --brand-ink:#9FE0D6;
  --amber:#EBB646; --amber-soft:#3A2D10; --amber-ink:#F3D08A;
  --good:#5CCB92; --good-soft:#183528; --bad:#F2877C; --bad-soft:#3D1D1A; --info-soft:#1A2A40; --info-ink:#9CC0EE;
  --rail:#071413; --rail-fg:#B0C4C0; --rail-active:#173230;
  --shadow:0 18px 40px -22px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12.5px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:flex;flex-wrap:wrap;min-height:100%}
.rail{flex:0 0 232px;background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;gap:20px;padding-block:22px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:16px;position:sticky;top:env(safe-area-inset-top, 0px);height:100vh;align-self:flex-start}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:18px;padding:0 6px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:#E0A21B;display:grid;place-items:center;flex:none}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--rail-fg)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--rail-fg);min-height:44px}
.nav button:hover{background:var(--rail-active);color:#fff}
.nav button[aria-current="page"]{background:var(--rail-active);color:#fff;box-shadow:inset 3px 0 0 #E0A21B}
.nav svg{flex:none}
.rail-foot{margin-top:auto;font-size:12px;color:var(--rail-fg);padding:0 6px;display:flex;flex-direction:column;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.main{flex:1 1 600px;min-width:0;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
@media (max-width: 860px){
  .rail{flex:1 1 100%;height:auto;position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-right:max(16px, env(safe-area-inset-right, 0px));overflow-x:auto}
  .brand small,.rail-foot{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav button{padding:9px 12px;white-space:nowrap}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 #E0A21B}
  .nav .lbl-long{display:none}
  .main{padding-block:20px 56px}
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--rail)}

.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.head h1{font-size:26px;font-weight:800}
.head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.amb{background:var(--amber);color:#1F0E02;border-color:var(--amber)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--surface)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{all:unset;box-sizing:border-box;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:16px;font-weight:800}
.panel-b{padding:16px 18px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .val{font-size:24px;font-weight:800;letter-spacing:-.02em}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:var(--rail);border-color:var(--rail);color:#fff}
.kpi.hero .lab,.kpi.hero .sub{color:#B9C4BF}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:color-mix(in srgb, var(--surface-2) 55%, transparent)}
tfoot td{font-weight:800;background:var(--surface-2)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.in{color:var(--good)} .out{color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--amber-soft);color:var(--amber-ink)}
.pill.info{background:var(--info-soft);color:var(--info-ink)}
.pill.neu{background:var(--surface-2);color:var(--muted)}
.tag-sample{font-size:11px;font-weight:700;color:var(--amber-ink);background:var(--amber-soft);padding:1px 7px;border-radius:999px;margin-left:6px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{min-height:40px;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%}
.inp:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;box-sizing:border-box;padding:8px 12px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.empty{padding:36px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty strong{color:var(--fg);font-size:16px}

.rpt h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 14px 6px}
.rpt td.ind{padding-left:30px}
.rpt tr.total td{font-weight:800;border-top:2px solid var(--fg)}
.rpt tr.grand td{font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand-ink)}
.check{display:flex;align-items:center;gap:8px;font-weight:700;padding:12px 14px}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.chart .g{stroke:var(--line)}
.chart .b-in{fill:var(--brand)}
.chart .b-out{fill:var(--amber)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.overlay{position:fixed;inset:0;background:rgba(10,16,14,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.modal{background:var(--surface);border-radius:18px;width:min(720px,100%);box-shadow:var(--shadow);border:1px solid var(--line);margin-top:4vh}
.modal.wide{width:min(920px,100%)}
.modal.narrow{width:min(440px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:18px;font-weight:800}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 18px 18px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.lines td{padding:6px 6px;border-bottom:none}
.lines th{padding:6px 6px;background:transparent}
.err{color:var(--bad);font-weight:600;font-size:13px}
.balance-bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-weight:700}

.inv-doc{border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:18px;background:var(--surface)}
.inv-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}
.inv-top h3{font-size:22px;font-weight:800;letter-spacing:.04em}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px, env(safe-area-inset-bottom, 0px));background:var(--rail);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;background:var(--amber-soft);color:var(--amber-ink);font-weight:600}
.acc-type{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--brand-ink);background:var(--brand-soft)}
.list{display:flex;flex-direction:column}
.list-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.list-row:last-child{border-bottom:none}
.list-row .t{min-width:0}
.list-row .t div:first-child{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{all:unset;cursor:pointer;color:var(--brand-ink);font-weight:700}
.link:hover{text-decoration:underline}
.login-card{max-width:440px;width:100%;margin:6vh auto 0}
[hidden]{display:none!important}
</style>

</div>

function isDebitNormal(t){return t==="asset"||t==="expense";}
function sums(pred){
  var m={};
  TX().forEach(function(t){ if(pred&&!pred(t))return; (t.lines||[]).forEach(function(l){var x=m[l.acc]||(m[l.acc]={d:0,c:0});x.d+=+l.d||0;x.c+=+l.c||0;}); });
  return m;
}

function txTotal(t){var s=0;(t.lines||[]).forEach(function(l){s+=+l.d||0;});return s;}
function inRange(t,p){return (!p.from||t.date>=p.from)&&(!p.to||t.date<=p.to);}

function nextNo(prefix,date,list,field){
  var ym=(date||today()).slice(0,7).replace("-","");var pre=prefix+"-"+ym+"-";var max=0;
  list.forEach(function(x){var v=x[field||"no"];if(v&&v.indexOf(pre)===0){var k=parseInt(v.slice(pre.length),10);if(k>max)max=k;}});
  return pre+String(max+1).padStart(4,"0");
}

function drawChart(){
  var svg=$("chart");if(!svg)return;var am=accMap();
  var months=[];var d=new Date();d.setDate(1);
  for(var i=5;i>=0;i--){var x=new Date(d.getFullYear(),d.getMonth()-i,1);months.push({k:x.getFullYear()+"-"+pad(x.getMonth()+1),l:MONTHS[x.getMonth()],inn:0,out:0});}
  var idx={};months.forEach(function(m,i){idx[m.k]=i;});
  TX().forEach(function(t){var k=(t.date||"").slice(0,7);if(!(k in idx))return;var c=cashDelta(t,am);if(c>0)months[idx[k]].inn+=c;else months[idx[k]].out-=c;});
  var max=0;months.forEach(function(m){max=Math.max(max,m.inn,m.out);});
  var step=niceStep(max/4);var top=step*4||1;
  var L=64,R=12,T=12,B=28,W=720-L-R,H=240-T-B;
  var o="";
  for(var g=0;g<=4;g++){var y=T+H-(H*g/4);o+='<line class="g" x1="'+L+'" x2="'+(720-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+short(step*g)+'</text>';}
  var bw=W/6;
  months.forEach(function(m,i){
    var x0=L+bw*i+bw*0.18, w=bw*0.3;
    var h1=H*m.inn/top,h2=H*m.out/top;
    o+='<rect class="b-in" x="'+x0+'" y="'+(T+H-h1)+'" width="'+w+'" height="'+Math.max(h1,0)+'" rx="3"><title>'+m.l+' masuk '+rp(m.inn)+'</title></rect>';
    o+='<rect class="b-out" x="'+(x0+w+4)+'" y="'+(T+H-h2)+'" width="'+w+'" height="'+Math.max(h2,0)+'" rx="3"><title>'+m.l+' keluar '+rp(m.out)+'</title></rect>';
    o+='<text x="'+(L+bw*i+bw/2)+'" y="'+(240-8)+'" text-anchor="middle">'+m.l+'</text>';
  });
  svg.innerHTML=o;
}
function niceStep(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v)));var f=v/p;var n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*p;}

      list.forEach(function(a){var v=nb(a,s[a.code]);t+=v;if(Math.round(v)!==0){any=true;html+='<tr><td class="ind"><span class="mono muted">'+a.code+'</span> '+esc(a.name)+'</td><td class="r num">'+rpAcc(v)+'</td></tr>';rows.push([a.code+" "+a.name,Math.round(v)]);}});

function bkCalc(b){
  var cfg=tcfg(),price=+b.price||0,trCharge=0,trOwnCharge=0,trOwnCost=0,trVendor=0,costs=0,paid=0;
  (b.transports||[]).forEach(function(t){var ch=+t.charge||0;trCharge+=ch;if(t.own){trOwnCharge+=ch;trOwnCost+=(+t.bensin||0)+(+t.fee||0);}else trVendor+=ch;});
  (b.costs||[]).forEach(function(c){costs+=+c.amount||0;});
  (b.payments||[]).forEach(function(p){paid+=+p.amount||0;});
  var kom=+(b.komisi&&b.komisi.amount)||0,ref=+(b.refund&&b.refund.amount)||0;
  var staff={tour:Math.round(kom*cfg.staffTourPct/100),transport:Math.round(trOwnCharge*cfg.staffTransportPct/100),product:Math.round((+b.pax||0)*cfg.productPerPax)};

function bkRead(){
  var v=function(id){return $(id).value;};
  var b=BK_EDIT?JSON.parse(JSON.stringify(BK_EDIT)):{id:uid(),createdAt:Date.now()};
  b.guest=v("bkG").trim();b.type=v("bkT");b.package=v("bkP").trim();b.start=v("bkS");b.end=v("bkE")||v("bkS");b.pax=num(v("bkX"));b.guide=v("bkGu").trim();b.price=num(v("bkPr"));b.notes=v("bkN").trim();
  b.payments=[].map.call(document.querySelectorAll("#bkPay tr"),function(tr){return {date:tr.querySelector(".bp-date").value,amount:num(tr.querySelector(".bp-amt").value),acc:tr.querySelector(".bp-acc").value};}).filter(function(p){return p.amount;});
  b.transports=[].map.call(document.querySelectorAll("#bkTr tr"),function(tr){return {driver:tr.querySelector(".bt-drv").value.trim(),own:tr.querySelector(".bt-own").value==="1",charge:num(tr.querySelector(".bt-ch").value),bensin:num(tr.querySelector(".bt-bn").value),fee:num(tr.querySelector(".bt-fee").value),payFrom:tr.querySelector(".bt-from").value,date:b.start};}).filter(function(t){return t.driver||t.charge||t.bensin||t.fee;});
  b.costs=[].map.call(document.querySelectorAll("#bkCost tr"),function(tr){return {date:tr.querySelector(".bc-date").value,desc:tr.querySelector(".bc-desc").value.trim(),cat:tr.querySelector(".bc-cat").value,amount:num(tr.querySelector(".bc-amt").value),payFrom:tr.querySelector(".bc-from").value};}).filter(function(c){return c.amount;});
  b.komisi={amount:num(v("bkK")),acc:v("bkKa")};b.refund={amount:num(v("bkR")),acc:v("bkRa")};
  return b;
}
function bkSummary(){var el=$("bkSum");if(!el)return;var c=bkCalc(bkRead());
  el.innerHTML='<span>Harga '+rp(c.price)+'</span><span>Biaya budget '+rp(c.budgetCost)+'</span><span>Laba budget '+rp(c.budgetMargin)+'</span><span>Laba tour bersih <span class="'+(c.net<0?"out":"in")+'">'+rp(c.net)+'</span></span><span>Sisa tagihan '+rp(c.due)+'</span>';}
function submitBk(){
  var err=$("bkErr");err.textContent="";var b=bkRead();
  if(!b.guest){err.textContent="Isi nama tamu atau agen.";return;}
  if(!b.start){err.textContent="Isi tanggal mulai tour.";return;}
  if(b.end<b.start){err.textContent="Tanggal selesai tidak boleh sebelum tanggal mulai.";return;}
  if(b.price<0){err.textContent="Harga paket tidak boleh minus.";return;}
  if(!b.no)b.no=nextNo("TOUR",b.start,S.bookings||[]);
  b.updatedAt=Date.now();var ed=!!BK_EDIT;
  put("bookings",b).then(function(){closeModal();toast(ed?"Booking diperbarui":"Booking "+b.no+" tersimpan");setTimeout(function(){bkView(b.id);},60);}).catch(function(){});
}

function accOptions(filter,sel){
  return TYPE_ORDER.map(function(ty){var l=sortedAccounts().filter(function(a){return a.type===ty&&(!filter||filter(a));});if(!l.length)return "";
    return '<optgroup label="'+TYPES[ty]+'">'+l.map(function(a){return '<option value="'+esc(a.code)+'"'+(a.code===sel?" selected":"")+'>'+esc(a.code+" · "+a.name)+'</option>';}).join("")+'</optgroup>';}).join("");
}

function submitTx(form){
  var kind=form.getAttribute("data-kind"),err=$("tErr");err.textContent="";
  var date=$("tDate").value,desc=$("tDesc").value.trim(),lines;
  if(!date){err.textContent="Isi tanggal transaksi.";return;}
  if(kind==="angsuran"){
    var at=num($("tAmt").value),bu=num($("tBunga").value),ca2=$("tCash").value,la=$("tOther").value;
    if(at<=0){err.textContent="Isi total angsuran.";return;}
    if(bu<0||bu>at){err.textContent="Bagian bunga harus antara 0 dan total angsuran.";return;}
    lines=[{acc:la,d:at-bu,c:0},{acc:"6-6100",d:bu,c:0},{acc:ca2,d:0,c:at}].filter(function(l){return l.d||l.c;});
  } else if(kind==="jurnal"){
    lines=jRead();var d=0,c=0;lines.forEach(function(x){d+=x.d;c+=x.c;});
    if(lines.length<2){err.textContent="Jurnal butuh minimal dua baris akun.";return;}
    if(Math.round(d)!==Math.round(c)||d<=0){err.textContent="Total debit dan kredit harus sama. Selisih saat ini "+rp(d-c)+".";return;}
  } else {
    var amt=num($("tAmt").value),ca=$("tCash").value,ot=$("tOther").value;
    if(amt<=0){err.textContent="Isi jumlah lebih dari nol.";return;}
    if(!ca||!ot){err.textContent="Pilih kedua akun.";return;}
    if(ca===ot){err.textContent="Akun asal dan tujuan tidak boleh sama.";return;}
    if(kind==="masuk")lines=[{acc:ca,d:amt,c:0},{acc:ot,d:0,c:amt}];
    else if(kind==="keluar")lines=[{acc:ot,d:amt,c:0},{acc:ca,d:0,c:amt}];
    else lines=[{acc:ot,d:amt,c:0},{acc:ca,d:0,c:amt}];
  }
  var prefix={masuk:"BKM",keluar:"BKK",transfer:"TRF",jurnal:"JU",angsuran:"ANG"}[kind];
  var tx=EDIT?Object.assign({},EDIT):{id:uid(),kind:kind,createdAt:Date.now(),no:nextNo(prefix,date,S.txs)};
  tx.date=date;tx.desc=desc;tx.lines=lines;if(kind==="angsuran"){tx.total=num($("tAmt").value);tx.bunga=num($("tBunga").value);}delete tx.review;tx.contact=$("tContact")?$("tContact").value.trim():"";tx.updatedAt=Date.now();
  if(EDIT&&EDIT.sample&&desc.indexOf("[Contoh]")<0)delete tx.sample;
  put("txs",tx).then(function(){closeModal();toast(EDIT?"Transaksi diperbarui":"Transaksi "+tx.no+" tersimpan");}).catch(function(){});
}

function submitAcc(){
  var code=$("aCode").value.trim(),name=$("aName").value.trim(),type=$("aType").value,cash=$("aCash").checked,err=$("aErr");
  if(!/^[0-9A-Za-z.\-]{2,20}$/.test(code)){err.textContent="Kode akun hanya huruf, angka, titik, atau tanda hubung (2–20 karakter).";return;}
  if(!name){err.textContent="Isi nama akun.";return;}
  if(cash&&type!=="asset"){err.textContent="Akun kas atau bank harus berada di kelompok Aset.";return;}
  if(!ACC_EDIT&&S.accounts.some(function(a){return a.code===code;})){err.textContent="Kode "+code+" sudah dipakai.";return;}
  var a={id:ACC_EDIT?ACC_EDIT.id:"acc-"+code.replace(/[^0-9A-Za-z-]/g,"-"),code:code,name:name,type:type,cash:cash};
  put("accounts",a).then(function(){closeModal();toast("Akun "+code+" tersimpan");}).catch(function(){});
}

/* csv */
function csvCell(v){v=v==null?"":String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function csv(rows){return "﻿"+rows.map(function(r){return r.map(csvCell).join(";");}).join("\r\n");}
function save(name,rows){
  if(!dl){toast("Unduhan tidak tersedia di tampilan ini.");return;}
  dl.save({filename:name,data:csv(rows)}).then(function(){toast("File "+name+" diunduh");}).catch(function(e){if(e&&e.code==="declined")return;toast("Unduhan gagal. Coba lagi sebentar lagi.");});
}

    case "bk-rowdel":t.closest("tr").remove();bkSummary();break;
    case "bk-add":var k=t.getAttribute("data-k"),sd=$("bkS").value||today(),df=($("bkPay").querySelector(".bp-acc")||{}).value;
      if(k==="pay")$("bkPay").insertAdjacentHTML("beforeend",bpRow({date:today()},sd));else if(k==="tr")$("bkTr").insertAdjacentHTML("beforeend",btRow({own:true}));else $("bkCost").insertAdjacentHTML("beforeend",bcRow({cat:"resto"},sd));break;
    case "csv-tour":var trs=[["No","Tamu","Paket","Mulai","Selesai","Pax","Harga paket","Biaya budget","Laba budget","Laba armada","Komisi vendor","Pengembalian","Komisi staf","Laba tour bersih","Dibayar"]];
      tourInPeriod().forEach(function(b){var c=bkCalc(b);trs.push([b.no,b.guest,b.package||"",b.start,b.end,b.pax||0,c.price,c.budgetCost,c.budgetMargin,c.armadaMargin,c.komisi,c.refund,c.staff.total,c.net,c.paid]);});
      save("booking-tour_"+fileStamp()+".csv",trs);break;
    case "user-new":userForm();break;
    case "user-edit":userForm(S.users.find(function(x){return String(x.id)===id;}));break;
    case "user-del":var us=S.users.find(function(x){return String(x.id)===id;});confirmBox("Hapus pengguna?","Akun <b>"+esc(us.username)+"</b> tidak akan bisa masuk lagi. Riwayat aktivitasnya tetap tersimpan.","Hapus",function(){api("DELETE","users/"+us.id).then(function(){toast("Pengguna dihapus");S.users=null;render();}).catch(function(e){toast(e.message);});});break;
    case "users-refresh":S.users=null;render();break;
    case "backup":var bk={format:"pembukuan-backup",version:1,exportedAt:new Date().toISOString(),company:S.company.name||"",accounts:S.accounts,transactions:S.txs,invoices:S.invoices,bookings:S.bookings,settings:{company:S.company,tour:S.tourCfg}};
      var slug=(S.company.name||"pembukuan").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"pembukuan";
      dl.save({filename:"backup-"+slug+"-"+today()+".json",data:JSON.stringify(bk,null,1)}).then(function(){toast("Backup diunduh");}).catch(function(e){if(e&&e.code==="declined")return;toast("Unduhan gagal. Coba lagi sebentar lagi.");});break;
  }
});
function showCopy(txt){openModal(mHead("Salin teks invoice")+'<div class="modal-b"><label for="cpTxt" class="muted small">Pilih semua teks lalu salin.</label><textarea class="inp" id="cpTxt" rows="12" readonly>'+esc(txt)+'</textarea></div><div class="modal-f"><button class="btn" type="button" data-act="close">Tutup</button></div>',"narrow");var ta=$("cpTxt");ta.focus();ta.select();}
document.addEventListener("change",function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute("data-chg");
  if(k==="pfrom"){S.period.from=t.value;S.preset="";render();}
  else if(k==="pto"){S.period.to=t.value;S.preset="";render();}
  else if(k==="kind"){S.kind=t.value;render();}
  else if(k==="ledger"){S.ledgerAcc=t.value;render();}
  else if(k==="import"){importFile(t);}
  if(t.id==="ufAll"){document.querySelectorAll(".uf-book").forEach(function(c){c.disabled=t.checked;if(t.checked)c.checked=true;});}
  if(t.closest&&t.closest("#jLines"))jBalance();
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.getAttribute("data-inp")==="q"){S.q=t.value;render();}
  if(t.getAttribute("data-inp")==="tq"){S.tq=t.value;render();}
  if(t.closest&&t.closest("#bkForm"))bkSummary();
  if(t.closest("#jLines"))jBalance();
  if(t.closest("#iItems"))iRead();
});
document.addEventListener("submit",function(e){
  e.preventDefault();var f=e.target;
  if(f.id==="bkForm")submitBk();else if(f.id==="tcForm"){putSetting("tour",{staffTourPct:num($("tcA").value),staffTransportPct:parseFloat(String($("tcB").value).replace(",","."))||0,productPerPax:num($("tcC").value)}).then(function(){toast("Aturan komisi disimpan");}).catch(function(){});}
  else if(f.id==="loginForm")doLogin();else if(f.id==="setupForm")doSetup();else if(f.id==="pwForm")doPw();else if(f.id==="userForm")submitUser();else if(f.id==="txForm")submitTx(f);else if(f.id==="invForm")submitInv();else if(f.id==="payForm")submitPay(f);else if(f.id==="accForm")submitAcc();
  else if(f.id==="coForm"){putCompany({name:$("coN").value.trim(),phone:$("coP").value.trim(),email:$("coE").value.trim(),npwp:$("coT").value.trim(),address:$("coA").value.trim(),bank:$("coB").value.trim()}).then(function(){toast("Profil usaha tersimpan");}).catch(function(){});}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("overlay").hidden)closeModal();});

render();
initStore();
})();
</script>
